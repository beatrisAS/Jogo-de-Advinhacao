<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogo de adivinhação</title>
<style>
  :root { --laranja:#ff8d61; --escuro:#1b1b1b; --fundo:#f1f0ec; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--fundo); color:var(--escuro); font-family:Arial, Helvetica, sans-serif; padding:1rem; }
  main { background:#fff; border-radius:16px; padding:2rem; width:100%; max-width:420px;
         box-shadow:0 4px 16px rgba(0,0,0,.08); }
  h1 { margin:0 0 .25rem; font-size:1.8rem; }
  .sub { margin:0 0 1.5rem; color:#5f5e5a; }
  .linha { display:flex; gap:.5rem; }
  input { flex:1; padding:.75rem; font-size:1.1rem; border:2px solid #d3d1c7; border-radius:10px; }
  input:focus { outline:none; border-color:var(--laranja); }
  button { padding:.75rem 1.1rem; font-size:1rem; font-weight:bold; border:none; border-radius:10px;
           background:var(--laranja); color:var(--escuro); cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #btn-reiniciar { width:100%; margin-top:1rem; background:var(--escuro); color:#fff; }
  #btn-reiniciar[hidden] { display:none; }
  #mensagem { min-height:3rem; margin:1.25rem 0 .5rem; font-size:1.1rem; font-weight:bold; }
  #mensagem.ok { color:#0f6e56; }
  #mensagem.fim { color:#c2410c; }
  #tentativas { margin:0; color:#5f5e5a; }
</style>
</head>
<body>
<main>
  <h1>Jogo de adivinhação</h1>
  <p class="sub">Pensei em um número de 1 a 100. Você tem 6 tentativas.</p>
  <div class="linha">
    <input id="palpite" type="number" min="1" max="100" placeholder="Seu palpite" autofocus>
    <button id="btn-palpitar" type="button">Palpitar</button>
  </div>
  <p id="mensagem" aria-live="polite"></p>
  <p id="tentativas"></p>
  <button id="btn-reiniciar" type="button" hidden>Jogar de novo</button>
</main>
<script src="jogo.js"></script>
</body>
</html>
